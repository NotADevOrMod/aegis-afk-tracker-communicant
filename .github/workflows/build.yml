name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m unittest discover -s tests -t .

      - name: Build the exe
        run: pyinstaller --onefile --name AegisReconnect run.py

      - uses: actions/upload-artifact@v4
        with:
          name: AegisReconnect
          path: dist/AegisReconnect.exe
