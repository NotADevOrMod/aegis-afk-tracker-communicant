name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file exe
        run: dotnet publish AegisAfkWatch.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: AegisAfkWatch
          path: publish/AegisAfkWatch.exe
